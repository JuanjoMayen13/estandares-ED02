<app-widget-card titulo="inicio.conexion" icono="fa-solid fa-server">
  <button accion type="button" class="btn-ghost h-7 shrink-0 px-2 text-xs" (click)="cambiar.emit()">
    {{ 'inicio.cambiar' | translate }}
  </button>
  <dl class="divide-y divide-subtle">
    <div class="flex h-9 items-center justify-between gap-3 text-sm">
      <dt class="text-muted">{{ 'inicio.estado' | translate }}</dt>
      <dd class="flex items-center gap-2 font-medium" [class]="conectado() ? 'text-success-strong' : 'text-danger-strong'">
        <span class="h-2 w-2 rounded-full" [class]="conectado() ? 'bg-success-600' : 'bg-danger-600'" aria-hidden="true"></span>
        {{ (conectado() ? 'inicio.conectado' : 'inicio.sinConexion') | translate }}
      </dd>
    </div>
    <div class="flex h-9 items-center justify-between gap-3 text-sm">
      <dt class="shrink-0 text-muted">{{ 'inicio.servidor' | translate }}</dt>
      <!-- Una sola línea: la URL completa queda en el tooltip -->
      <dd class="min-w-0 truncate font-mono text-xs text-primary" [title]="url()">{{ servidor() || '—' }}</dd>
    </div>
    <div class="flex h-9 items-center justify-between gap-3 text-sm">
      <dt class="text-muted">{{ 'inicio.versionWeb' | translate }}</dt>
      <dd class="tabular-nums text-primary">{{ versionWeb() || '—' }}</dd>
    </div>
    <div class="flex h-9 items-center justify-between gap-3 text-sm">
      <dt class="text-muted">{{ 'inicio.versionApi' | translate }}</dt>
      <dd class="tabular-nums text-primary">{{ versionApi() || '—' }}</dd>
    </div>
  </dl>
</app-widget-card>
